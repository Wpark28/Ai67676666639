<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>ErgAI</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007AFF'/><text x='50' y='68' text-anchor='middle' font-size='50' fill='white'>E</text></svg>">
  <style>
/* ===== ROOT & RESET ===== */
:root {
  --bg: #000000;
  --bg-secondary: #1c1c1e;
  --bg-tertiary: #2c2c2e;
  --bg-card: rgba(44,44,46,0.6);
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --text-tertiary: #636366;
  --blue: #007AFF;
  --green: #34C759;
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFD60A;
  --purple: #AF52DE;
  --indigo: #5856D6;
  --cyan: #32D74B;
  --pink: #FF2D55;
  --teal: #64D2FF;
  --tab-height: 83px;
  --nav-height: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

body { position: fixed; width: 100%; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* ===== NAV BAR ===== */
#nav-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  padding-top: calc(var(--safe-top) + 8px);
  min-height: var(--nav-height);
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
  position: relative;
  z-index: 100;
}

#nav-title {
  font-size: 17px;
  font-weight: 700;
}

.nav-btn {
  position: absolute;
  right: 16px;
  background: none;
  border: none;
  color: var(--blue);
  font-size: 15px;
  cursor: pointer;
  padding: 8px;
}

.nav-btn.hidden { display: none; }

.nav-back {
  position: absolute;
  left: 16px;
  right: auto;
  background: none;
  border: none;
  color: var(--blue);
  font-size: 15px;
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ===== MAIN CONTENT ===== */
#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  padding-bottom: calc(var(--tab-height) + 16px);
}

/* ===== TAB BAR ===== */
#tab-bar {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  padding: 6px 0;
  padding-bottom: calc(var(--safe-bottom) + 6px);
  background: rgba(28,28,30,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(255,255,255,0.08);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: var(--tab-height);
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 10px;
  cursor: pointer;
  padding: 4px 12px;
  transition: color 0.2s;
  flex: 1;
}

.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--blue); }
.tab:active { opacity: 0.6; }

.capture-tab .capture-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: -4px;
}

.capture-tab .capture-icon svg { width: 22px; height: 22px; color: #fff; }

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  border: 0.5px solid rgba(255,255,255,0.06);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.card-title {
  font-size: 17px;
  font-weight: 600;
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ===== BUTTONS ===== */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: opacity 0.2s;
  font-family: inherit;
}

.btn:active { opacity: 0.7; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-gray { background: var(--bg-tertiary); color: var(--text); }
.btn-outline { background: none; border: 1px solid var(--blue); color: var(--blue); }

.btn-small {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  width: auto;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

/* ===== RINGS / GAUGES ===== */
.ring-container {
  display: flex;
  justify-content: center;
  padding: 12px 0;
}

.ring {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring svg { transform: rotate(-90deg); }

.ring-label {
  position: absolute;
  text-align: center;
}

.ring-value {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.ring-caption {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.ring-status {
  font-size: 13px;
  font-weight: 600;
  margin-top: 2px;
}

/* ===== STATUS STRIP ===== */
.status-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.status-item {
  text-align: center;
  padding: 10px 4px;
}

.status-icon { font-size: 14px; margin-bottom: 4px; }
.status-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.status-label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat-card {
  text-align: center;
  padding: 12px 8px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  backdrop-filter: blur(12px);
}

.stat-icon { font-size: 20px; margin-bottom: 6px; }
.stat-value { font-size: 17px; font-weight: 700; }
.stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 4px; }

/* ===== SEGMENTED CONTROL ===== */
.segmented {
  display: flex;
  background: var(--bg-tertiary);
  border-radius: 8px;
  padding: 2px;
  margin-bottom: 16px;
}

.segmented button {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 7px;
  background: none;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.25s;
}

.segmented button.active {
  background: var(--bg-secondary);
  color: var(--text);
  font-weight: 600;
}

/* ===== LIST ===== */
.list-section {
  margin-bottom: 20px;
}

.list-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 0 8px 0;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  cursor: pointer;
  transition: background 0.15s;
}

.list-item:first-of-type { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.list-item:last-of-type { border-radius: 0 0 var(--radius-sm) var(--radius-sm); border-bottom: none; }
.list-item:only-of-type { border-radius: var(--radius-sm); }
.list-item:active { background: var(--bg-tertiary); }

.list-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.list-item-content { flex: 1; }
.list-item-title { font-size: 16px; }
.list-item-subtitle { font-size: 12px; color: var(--text-secondary); }
.list-arrow { color: var(--text-tertiary); font-size: 14px; }

/* ===== FORM ===== */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-input, .form-select {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-xs);
  border: 0.5px solid rgba(255,255,255,0.1);
  background: var(--bg-tertiary);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  outline: none;
}

.form-input:focus, .form-select:focus {
  border-color: var(--blue);
}

.form-input::placeholder { color: var(--text-tertiary); }

/* ===== PROGRESS BARS ===== */
.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

/* ===== BATTERY ===== */
.battery {
  width: 100px;
  height: 180px;
  border: 3px solid;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

.battery-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  transition: height 0.8s ease;
  border-radius: 0 0 9px 9px;
}

.battery-label {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1;
}

/* ===== BIOMETRIC GRID ===== */
.bio-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.bio-card {
  text-align: center;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03);
}

.bio-icon { font-size: 22px; margin-bottom: 6px; }
.bio-value { font-size: 16px; font-weight: 700; }
.bio-title { font-size: 11px; font-weight: 600; margin-top: 4px; }
.bio-detail { font-size: 9px; color: var(--text-tertiary); }

/* ===== SLEEP STAGES ===== */
.sleep-stage {
  margin-bottom: 12px;
}

.sleep-stage-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}

.sleep-stage-label { font-weight: 600; }
.sleep-stage-time { color: var(--text-secondary); }
.sleep-stage-ideal { color: var(--text-tertiary); font-size: 10px; }

/* ===== SCORE ROW ===== */
.score-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
}

.score-row:last-child { border-bottom: none; }

.score-type {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.score-split { font-size: 17px; font-weight: 700; }
.score-info { flex: 1; }
.score-meta { text-align: right; }
.score-distance { font-size: 14px; }
.score-date { font-size: 11px; color: var(--text-secondary); }

/* ===== EXERCISE LIST ===== */
.exercise-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
}

.exercise-item:last-child { border-bottom: none; }

/* ===== HR DISPLAY ===== */
.hr-big {
  font-size: 72px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
  line-height: 1;
}

.hr-source-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  font-size: 13px;
  margin-bottom: 12px;
}

/* ===== CALORIE RING ===== */
.macro-bar-container {
  margin-bottom: 12px;
}

.macro-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}

/* ===== RECOVERY HISTORY BAR CHART ===== */
.history-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 80px;
}

.history-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.history-bar-fill {
  width: 100%;
  border-radius: 4px;
  min-height: 4px;
  transition: height 0.5s ease;
}

.history-bar-label { font-size: 9px; color: var(--text-secondary); }
.history-bar-value { font-size: 10px; font-weight: 600; }

/* ===== RECOMMENDATION ===== */
.rec-card {
  padding: 16px;
}

.rec-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.rec-icon { font-size: 22px; }
.rec-title { font-size: 16px; font-weight: 600; flex: 1; }

.rec-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
}

.rec-message {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: 12px;
}

.rec-workout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 0.5px solid rgba(255,255,255,0.08);
}

.rec-workout-info { font-size: 12px; color: var(--text-secondary); }

/* ===== TREND BARS ===== */
.trend-bars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  text-align: center;
}

.trend-bar { display: flex; flex-direction: column; align-items: center; gap: 4px; }

.trend-value { font-size: 22px; font-weight: 700; }

.trend-fill-container {
  width: 100%;
  height: 60px;
  background: rgba(255,255,255,0.05);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}

.trend-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  border-radius: 4px;
  transition: height 0.5s ease;
}

.trend-label { font-size: 10px; color: var(--text-secondary); }

/* ===== MODAL / SHEET ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-sheet {
  background: var(--bg-secondary);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: var(--text-tertiary);
  margin: 0 auto 16px;
}

/* ===== CAMERA ===== */
#camera-video {
  width: 100%;
  border-radius: var(--radius);
  background: #000;
}

#camera-canvas { display: none; }

.camera-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 20px;
}

.shutter-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: transparent;
  cursor: pointer;
  position: relative;
}

.shutter-btn::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s;
}

.shutter-btn:active::after { transform: scale(0.85); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.empty-subtitle { font-size: 13px; }

/* ===== GYM ===== */
.set-row {
  display: grid;
  grid-template-columns: 40px 1fr 1fr 60px;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
}

.set-number {
  font-weight: 600;
  color: var(--text-secondary);
}

/* ===== WATER TRACKER ===== */
.water-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 12px 0;
}

.water-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--blue);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.water-dot.filled { background: var(--blue); }

/* ===== FOOD SEARCH ===== */
.food-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
  cursor: pointer;
}

.food-item:active { background: var(--bg-tertiary); }
.food-name { font-size: 15px; }
.food-cal { font-size: 13px; color: var(--text-secondary); }
.food-macros { font-size: 11px; color: var(--text-tertiary); }

/* ===== ANIMATION ===== */
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.pulse { animation: pulse 1.5s ease infinite; }

@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }

/* ===== UTILITIES ===== */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.w-full { width: 100%; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.hidden { display: none !important; }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.text-xxs { font-size: 9px; }
.font-bold { font-weight: 700; }
.font-mono { font-variant-numeric: tabular-nums; }
.opacity-50 { opacity: 0.5; }
.color-blue { color: var(--blue); }
.color-red { color: var(--red); }
.color-green { color: var(--green); }
.color-orange { color: var(--orange); }
.color-yellow { color: var(--yellow); }
.color-purple { color: var(--purple); }
.color-indigo { color: var(--indigo); }
.color-secondary { color: var(--text-secondary); }
.color-tertiary { color: var(--text-tertiary); }
.bg-blue { background: var(--blue); }
.bg-red { background: var(--red); }
.bg-green { background: var(--green); }
.bg-orange { background: var(--orange); }
  </style>
</head>
<body>
  <div id="app">
    <!-- Navigation bar -->
    <header id="nav-bar">
      <h1 id="nav-title">ErgAI</h1>
      <button id="nav-right-btn" class="nav-btn hidden"></button>
    </header>

    <!-- Main content area -->
    <main id="content"></main>

    <!-- Tab bar -->
    <nav id="tab-bar">
      <button class="tab active" data-tab="dashboard">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h1v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7h1a1 1 0 00.7-1.7l-9-9a1 1 0 00-1.4 0l-9 9A1 1 0 003 13z"/></svg>
        <span>Dashboard</span>

// ===== IndexedDB Data Store =====
// Persistent storage for all app data

const DB_NAME = 'ergai';
const DB_VERSION = 1;

const Store = {
  db: null,

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('scores')) {
          const s = db.createObjectStore('scores', { keyPath: 'id', autoIncrement: true });
          s.createIndex('date', 'date');
        }
        if (!db.objectStoreNames.contains('dailyStatus')) {
          const d = db.createObjectStore('dailyStatus', { keyPath: 'id', autoIncrement: true });
          d.createIndex('date', 'date');
        }
        if (!db.objectStoreNames.contains('gymSessions')) {
          const g = db.createObjectStore('gymSessions', { keyPath: 'id', autoIncrement: true });
          g.createIndex('date', 'date');
        }
        if (!db.objectStoreNames.contains('calorieEntries')) {
          const c = db.createObjectStore('calorieEntries', { keyPath: 'id', autoIncrement: true });
          c.createIndex('date', 'date');
        }
        if (!db.objectStoreNames.contains('hrSessions')) {
          const h = db.createObjectStore('hrSessions', { keyPath: 'id', autoIncrement: true });
          h.createIndex('date', 'date');
        }
        if (!db.objectStoreNames.contains('baselines')) db.createObjectStore('baselines', { keyPath: 'id' });
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  },

  // Generic CRUD
  async put(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  async get(storeName, key) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async getAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  async delete(storeName, key) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  async clear(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  // ===== Profile =====
  async getProfile() {
    const all = await this.getAll('profile');
    return all[0] || null;
  },

  async saveProfile(profile) {
    profile.id = 'main';
    return this.put('profile', profile);
  },

  // ===== Scores =====
  async getScores() {
    const all = await this.getAll('scores');
    return all.sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  async addScore(score) {
    score.date = score.date || new Date().toISOString();
    return this.put('scores', score);
  },

  // ===== Daily Status =====
  async getDailyStatuses() {
    const all = await this.getAll('dailyStatus');
    return all.sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  async saveDailyStatus(status) {
    status.date = status.date || new Date().toISOString();
    return this.put('dailyStatus', status);
  },

  async getTodayStatus() {
    const all = await this.getDailyStatuses();
    const today = new Date().toDateString();
    return all.find(s => new Date(s.date).toDateString() === today) || null;
  },

  // ===== Gym Sessions =====
  async getGymSessions() {
    const all = await this.getAll('gymSessions');
    return all.sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  async saveGymSession(session) {
    session.date = session.date || new Date().toISOString();
    return this.put('gymSessions', session);
  },

  // ===== Calorie Entries =====
  async getCalorieEntries() {
    const all = await this.getAll('calorieEntries');
    return all.sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  async addCalorieEntry(entry) {
    entry.date = entry.date || new Date().toISOString();
    return this.put('calorieEntries', entry);
  },

  async getTodayCalories() {
    const all = await this.getCalorieEntries();
    const today = new Date().toDateString();
    return all.filter(e => new Date(e.date).toDateString() === today);
  },

  // ===== Baselines =====
  async getBaselines() {
    return (await this.get('baselines', 'main')) || {
      id: 'main',
      hrvBaseline: 55,
      rhrBaseline: 60,
      respRateBaseline: 15,
      spo2Baseline: 97,
      sleepBaseline: 450,
      tempBaseline: 0,
      sampleCount: 0
    };
  },

  async saveBaselines(baselines) {
    baselines.id = 'main';
    return this.put('baselines', baselines);
  }
};

// ===== Recovery Engine =====
const RecoveryEngine = {
  async calculateRecoveryScore(data, baselines) {
    let score = 0, totalWeight = 0;

    // 1. HRV (30%)
    if (data.hrv != null) {
      const w = 0.30;
      const ratio = data.hrv / Math.max(baselines.hrvBaseline, 1);
      const s = Math.min(Math.max(ratio * 50 + 25, 0), 100);
      score += s * w;
      totalWeight += w;
    }

    // 2. Resting HR (20%)
    if (data.rhr != null) {
      const w = 0.20;
      const ratio = baselines.rhrBaseline / Math.max(data.rhr, 1);
      const s = Math.min(Math.max(ratio * 50 + 25, 0), 100);
      score += s * w;
      totalWeight += w;
    }

    // 3. Respiratory Rate (10%)
    if (data.respiratoryRate != null) {
      const w = 0.10;
      const dev = Math.abs(data.respiratoryRate - baselines.respRateBaseline) / baselines.respRateBaseline;
      const s = Math.max(100 - dev * 200, 0);
      score += s * w;
      totalWeight += w;
    }

    // 4. Blood Oxygen (10%)
    if (data.bloodOxygen != null) {
      const w = 0.10;
      let s;
      if (data.bloodOxygen >= 98) s = 100;
      else if (data.bloodOxygen >= 96) s = 80;
      else if (data.bloodOxygen >= 94) s = 60;
      else if (data.bloodOxygen >= 92) s = 40;
      else s = 20;
      score += s * w;
      totalWeight += w;
    }

    // 5. Sleep (25%)
    const sleepW = 0.25;
    const sleepS = this.calculateSleepScore(data.sleepMinutes || 0, data.deepSleepMinutes || 0, data.remSleepMinutes || 0);
    score += sleepS * sleepW;
    totalWeight += sleepW;

    // 6. Wrist Temp (5%)
    if (data.wristTemp != null) {
      const w = 0.05;
      const dev = Math.abs(data.wristTemp - baselines.tempBaseline);
      let s;
      if (dev < 0.2) s = 100;
      else if (dev < 0.5) s = 75;
      else if (dev < 1.0) s = 50;
      else s = 25;
      score += s * w;
      totalWeight += w;
    }

    if (totalWeight > 0) score = score / totalWeight;
    else score = 50;

    // Strain penalty
    const penalty = Math.max(0, ((data.previousDayStrain || 0) - 60) * 0.3);
    score = Math.max(0, Math.min(100, score - penalty));

    return Math.round(score * 10) / 10;
  },

  calculateSleepScore(totalMin, deepMin, remMin) {
    let score = 0;

    // Duration (60%)
    let durScore;
    if (totalMin >= 420 && totalMin <= 540) durScore = 100;
    else if (totalMin >= 360) durScore = 80;
    else if (totalMin >= 300) durScore = 60;
    else if (totalMin >= 240) durScore = 40;
    else durScore = Math.max(totalMin / 420 * 40, 0);
    score += durScore * 0.6;

    // Deep (25%)
    const deepTarget = totalMin * 0.175;
    const deepRatio = totalMin > 0 ? deepMin / deepTarget : 0;
    score += Math.min(deepRatio * 100, 100) * 0.25;

    // REM (15%)
    const remTarget = totalMin * 0.225;
    const remRatio = totalMin > 0 ? remMin / remTarget : 0;
    score += Math.min(remRatio * 100, 100) * 0.15;

    return Math.min(score, 100);
  },

  calculateActivityStrain(durationMinutes, avgHR, maxHR, maxHeartRate, activityType) {
    const durationHours = durationMinutes / 60;
    let strain = 0;

    if (avgHR) {
      const pct = avgHR / maxHeartRate;
      let factor;
      if (pct < 0.5) factor = 12;
      else if (pct < 0.6) factor = 33;
      else if (pct < 0.7) factor = 67;
      else if (pct < 0.8) factor = 124;
      else if (pct < 0.9) factor = 205;
      else factor = 319;

      strain = durationHours * factor;

      if (maxHR) {
        const maxPct = maxHR / maxHeartRate;
        if (maxPct > 0.9) strain += 7;
        if (maxPct > 0.95) strain += 5;
      }
    } else {
      const factors = {
        'rowing_hard': 180, 'interval': 180, '2k': 180, 'test': 180,
        'rowing_moderate': 114, 'threshold': 114,
        'steady_state': 67, 'rowing_easy': 67,
        'gym_heavy': 124, 'gym_moderate': 90,
        'walking': 33, 'recovery': 24
      };
      strain = durationHours * (factors[activityType] || 67);
    }

    return Math.min(strain, 100);
  },

  calculateGymStrain(totalVolume, sets, durationMinutes, avgHR, maxHeartRate) {
    const durationHours = durationMinutes / 60;
    const volumeStrain = Math.log10(Math.max(totalVolume, 1)) * 18;
    const durationStrain = durationHours * 57;
    const setStrain = sets * 3.3;
    let strain = volumeStrain + durationStrain + setStrain;

    if (avgHR) {
      const pct = avgHR / maxHeartRate;
      strain *= (0.5 + pct);
    }

    return Math.min(strain, 100);
  },

  calculateBaselineEnergy(recoveryScore, sleepScore) {
    return Math.min(recoveryScore * 0.7 + sleepScore * 0.3, 100);
  },

  calculateEnergyDrain(strain, durationMinutes, currentEnergy, activityType) {
    let drain = strain * 0.6;
    const durationFactor = 1.0 + (durationMinutes / 120) * 0.3;
    drain *= durationFactor;

    const mods = { '2k': 1.3, 'test': 1.3, 'interval': 1.3, 'gym_heavy': 1.1, 'steady_state': 0.8, 'recovery': 0.5, 'walking': 0.5 };
    if (mods[activityType]) drain *= mods[activityType];

    if (currentEnergy < 30) drain *= 1.2;

    return Math.min(drain, currentEnergy);
  },

  updateBaselines(baselines, data) {
    const alpha = baselines.sampleCount < 14 ? 0.3 : 0.1;
    baselines.sampleCount++;
    if (data.hrv != null) baselines.hrvBaseline = baselines.hrvBaseline * (1 - alpha) + data.hrv * alpha;
    if (data.rhr != null) baselines.rhrBaseline = baselines.rhrBaseline * (1 - alpha) + data.rhr * alpha;
    if (data.respiratoryRate != null) baselines.respRateBaseline = baselines.respRateBaseline * (1 - alpha) + data.respiratoryRate * alpha;
    if (data.bloodOxygen != null) baselines.spo2Baseline = baselines.spo2Baseline * (1 - alpha) + data.bloodOxygen * alpha;
    if (data.sleepMinutes != null) baselines.sleepBaseline = baselines.sleepBaseline * (1 - alpha) + data.sleepMinutes * alpha;
    if (data.wristTemp != null) baselines.tempBaseline = baselines.tempBaseline * (1 - alpha) + data.wristTemp * alpha;
    return baselines;
  }
};

// ===== AI Coach =====
const AICoach = {
  generateRecommendation(profile, scores, todayStatus) {
    if (!profile) return null;

    const recovery = todayStatus?.recoveryScore ?? 50;
    const strain = todayStatus?.strainScore ?? 0;
    const energy = todayStatus?.energyLevel ?? 70;
    const sleepScore = todayStatus?.sleepScore ?? 50;

    // Recovery-based logic
    if (recovery < 33) {
      return {
        category: 'recovery',
        title: 'Rest Day Recommended',
        message: `Your recovery is at ${Math.round(recovery)}%. Your body needs time to repair. Take a rest day or do very light activity only — a 20-minute easy walk or gentle stretching. Focus on hydration and nutrition.`,
        icon: '😴',
        color: 'red'
      };
    }

    if (recovery < 50) {
      return {
        category: 'recovery',

        message: `Recovery at ${Math.round(recovery)}%. Keep it light today — a 30-40 min steady state row at rate 18-20, or easy mobility work. Stay below zone 2.`,

        icon: '🚣',

      };

    if (energy < 30) {
      return {
        category: 'warning',
        title: 'Energy Depleted',
        message: `Energy is at ${Math.round(energy)}%. Even though recovery is decent, you've already done a lot today. Rest up and recharge for tomorrow.`,
        icon: '🔋',
        color: 'orange'
      };
    }

    // Check recent scores for progress
    const recent2ks = scores.filter(s => s.workoutType === '2k').slice(0, 3);

    if (recovery >= 80 && energy >= 70) {
      // High recovery = good day for hard work
      if (profile.totalWorkouts % 7 === 0 && profile.totalWorkouts > 0) {
        return {
          category: 'milestone',
          title: 'Test Piece Day',
          message: `Recovery is ${Math.round(recovery)}% — excellent! Great day for a 2K test or hard intervals. Your body is primed for peak performance.`,
          suggestedWorkout: { type: '2k', duration: 10, split: profile.pr2k ? formatSplit(profile.pr2k) : '1:50', strokeRate: 30, intensity: 'Max' },
          icon: '🏆',
          color: 'yellow'
        };
      }

      return {
        category: 'workout',
        title: 'Hard Interval Day',
        message: `Recovery at ${Math.round(recovery)}% with good energy. Push hard today — 8x500m intervals with 2 min rest, or a 6K at threshold pace.`,
        suggestedWorkout: { type: 'interval', duration: 45, split: '1:45', strokeRate: 28, intensity: 'Hard' },
        icon: '💪',
        color: 'blue'
      };
    }

    if (recovery >= 50) {
      return {
        category: 'workout',
        title: 'Moderate Steady State',
        message: `Recovery at ${Math.round(recovery)}%. Good day for a solid 45-60 minute steady state piece. Focus on technique and consistent splits.`,
        suggestedWorkout: { type: 'steady_state', duration: 50, split: '2:05', strokeRate: 20, intensity: 'Moderate' },
        icon: '🚣',
        color: 'blue'
      };
    }

    return {
      category: 'workout',
      title: 'Light Training Day',
      message: 'Moderate recovery. Keep the intensity down — easy steady state or technique work.',
      suggestedWorkout: { type: 'steady_state', duration: 30, split: '2:10', strokeRate: 18, intensity: 'Easy' },
      icon: '🚣',
      color: 'green'
    };
  },

  generateWeeklyPlan(profile, todayStatus) {
    if (!profile) return [];

    const recovery = todayStatus?.recoveryScore ?? 60;
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const today = new Date().getDay();
    const plan = [];

    // Polarized model: 80% easy, 20% hard
    const template = [
      { day: 'Monday', type: 'Steady State', intensity: 'Easy', duration: 50, sr: 18 },
      { day: 'Tuesday', type: 'Intervals', intensity: 'Hard', duration: 40, sr: 28 },
      { day: 'Wednesday', type: 'Steady State', intensity: 'Easy', duration: 60, sr: 20 },
      { day: 'Thursday', type: 'Gym + Easy Row', intensity: 'Moderate', duration: 45, sr: 18 },
      { day: 'Friday', type: 'Steady State', intensity: 'Easy', duration: 50, sr: 20 },
      { day: 'Saturday', type: 'Hard Pieces', intensity: 'Hard', duration: 35, sr: 30 },
      { day: 'Sunday', type: 'Rest / Light', intensity: 'Recovery', duration: 0, sr: 0 }
    ];

    // Adjust based on recovery
    for (const t of template) {
      if (recovery < 40 && t.intensity === 'Hard') {
        t.type = 'Easy Steady State';
        t.intensity = 'Easy';
        t.sr = 18;
      }
      plan.push(t);
    }

    return plan;
  }
};

// ===== Utility Functions =====
function formatSplit(seconds) {
  if (!seconds) return '--';
  const min = Math.floor(seconds / 60);
  const sec = seconds - min * 60;
  return `${min}:${sec < 10 ? '0' : ''}${sec.toFixed(1)}`;
}

function formatDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatTime(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function recoveryColor(score) {
  if (score >= 67) return 'var(--green)';
  if (score >= 34) return 'var(--yellow)';
  return 'var(--red)';
}

function recoveryCategory(score) {
  if (score >= 67) return 'Green';
  if (score >= 34) return 'Yellow';
  return 'Red';
}

function strainColor(strain) {
  if (strain < 25) return 'var(--blue)';
  if (strain < 50) return 'var(--green)';
  if (strain < 75) return 'var(--orange)';
  return 'var(--red)';
}

function strainCategory(strain) {
  if (strain < 25) return 'Light';
  if (strain < 50) return 'Moderate';
  if (strain < 75) return 'High';
  return 'Overload';
}

function energyColor(energy) {
  if (energy >= 70) return 'var(--green)';
  if (energy >= 40) return 'var(--yellow)';
  if (energy >= 20) return 'var(--orange)';
  return 'var(--red)';
}

function energyCategory(energy) {
  if (energy >= 70) return 'High';
  if (energy >= 40) return 'Moderate';
  if (energy >= 20) return 'Low';
  return 'Depleted';
}

function ringSVG(size, strokeWidth, progress, color, bgOpacity = 0.15) {
  const r = (size - strokeWidth) / 2;
  const c = Math.PI * 2 * r;
  const offset = c * (1 - Math.min(Math.max(progress, 0), 1));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-opacity="${bgOpacity}" stroke-width="${strokeWidth}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.8s ease"/>
  </svg>`;
}

function gaugeArcSVG(size, strokeWidth, progress, color) {
  const r = (size - strokeWidth) / 2;
  const startAngle = 135;
  const sweepAngle = 270;
  const endAngle = startAngle + sweepAngle * Math.min(Math.max(progress, 0), 1);

  function polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  const cx = size / 2, cy = size / 2;

  // Background arc
  const bgStart = polarToCartesian(cx, cy, r, startAngle);
  const bgEnd = polarToCartesian(cx, cy, r, startAngle + sweepAngle);
  const bgLargeArc = sweepAngle > 180 ? 1 : 0;
  const bgPath = `M ${bgStart.x} ${bgStart.y} A ${r} ${r} 0 ${bgLargeArc} 1 ${bgEnd.x} ${bgEnd.y}`;

  // Value arc
  const valEnd = polarToCartesian(cx, cy, r, endAngle);
  const valSweep = sweepAngle * Math.min(Math.max(progress, 0), 1);
  const valLargeArc = valSweep > 180 ? 1 : 0;
  const valPath = `M ${bgStart.x} ${bgStart.y} A ${r} ${r} 0 ${valLargeArc} 1 ${valEnd.x} ${valEnd.y}`;

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <path d="${bgPath}" fill="none" stroke="${color}" stroke-opacity="0.15" stroke-width="${strokeWidth}" stroke-linecap="round"/>
    <path d="${valPath}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round"
      style="transition:d 0.8s ease"/>
  </svg>`;
}

// ===== Web Bluetooth Heart Rate Service =====
// Connects to Polar H10/H9 and other BLE HR monitors via Web Bluetooth API

const BluetoothHR = {
  device: null,
  server: null,
  characteristic: null,
  connected: false,
  currentHR: 0,
  rrIntervals: [],
  batteryLevel: null,
  deviceName: null,
  hrHistory: [],
  onUpdate: null,    // callback(hr, rrIntervals)
  onConnect: null,   // callback(deviceName)
  onDisconnect: null, // callback()

  isSupported() {
    return !!navigator.bluetooth;
  },

  async scan() {
    if (!this.isSupported()) {
      throw new Error('Web Bluetooth is not supported in this browser. Use Chrome or Edge.');
    }

    try {
      this.device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [0x180D] }], // Heart Rate Service
        optionalServices: [0x180F]          // Battery Service
      });

      this.device.addEventListener('gattserverdisconnected', () => {
        this.connected = false;
        this.currentHR = 0;
        if (this.onDisconnect) this.onDisconnect();
      });

      return this.device;
    } catch (e) {
      if (e.name === 'NotFoundError') return null; // User cancelled
      throw e;
    }
  },

  async connect() {
    if (!this.device) throw new Error('No device selected');

    this.server = await this.device.gatt.connect();
    this.connected = true;
    this.deviceName = this.device.name || 'HR Monitor';

    // Heart Rate Service
    try {
      const hrService = await this.server.getPrimaryService(0x180D);
      this.characteristic = await hrService.getCharacteristic(0x2A37);
      this.characteristic.addEventListener('characteristicvaluechanged', (e) => this.handleHRData(e));
      await this.characteristic.startNotifications();
    } catch (e) {
      console.error('HR service error:', e);
    }

    // Battery Service
    try {
      const batService = await this.server.getPrimaryService(0x180F);
      const batChar = await batService.getCharacteristic(0x2A19);
      const batValue = await batChar.readValue();
      this.batteryLevel = batValue.getUint8(0);
    } catch (e) {
      // Battery service not available on all devices
    }

    if (this.onConnect) this.onConnect(this.deviceName);
  },

  disconnect() {
    if (this.device && this.device.gatt.connected) {
      this.device.gatt.disconnect();
    }
    this.connected = false;
    this.currentHR = 0;
    this.deviceName = null;
    this.batteryLevel = null;
  },

  handleHRData(event) {
    const value = event.target.value;
    const flags = value.getUint8(0);
    const is16Bit = flags & 0x01;
    let hr, offset;

    if (is16Bit) {
      hr = value.getUint16(1, true);
      offset = 3;
    } else {
      hr = value.getUint8(1);
      offset = 2;
    }

    // Skip energy expended if present
    if (flags & 0x08) offset += 2;

    // Parse R-R intervals
    const rr = [];
    if (flags & 0x10) {
      while (offset + 1 < value.byteLength) {
        const raw = value.getUint16(offset, true);
        rr.push(raw * 1000.0 / 1024.0);
        offset += 2;
      }
    }

    this.currentHR = hr;
    this.rrIntervals = rr;
    this.hrHistory.push({ time: Date.now(), hr });

    // Keep last 5 min of history
    const fiveMinAgo = Date.now() - 300000;
    this.hrHistory = this.hrHistory.filter(h => h.time > fiveMinAgo);

    if (this.onUpdate) this.onUpdate(hr, rr);
  },

  clearHistory() {
    this.hrHistory = [];
  },

  getSessionStats() {
    if (this.hrHistory.length === 0) return { avg: 0, max: 0, min: 0, count: 0 };
    const hrs = this.hrHistory.map(h => h.hr);
    return {
      avg: Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length),
      max: Math.max(...hrs),
      min: Math.min(...hrs),
      count: hrs.length
    };
  }
};

    html += `<div class="flex gap-8" style="margin-bottom:16px">
      <div class="stat-card" style="flex:1">
        <div class="stat-icon" style="color:var(--red)">&#128293;</div>
        <div class="stat-value">${status?.activeCalories ?? 0}</div>
        <div class="stat-label">Active Cal</div>
      </div>
      <div class="stat-card" style="flex:1">
        <div class="stat-icon" style="color:var(--green)">&#127939;</div>
        <div class="stat-value">${status?.activeMinutes ?? 0}</div>
        <div class="stat-label">Active Min</div>
      </div>
      <div class="stat-card" style="flex:1">
        <div class="stat-icon" style="color:var(--blue)">&#128095;</div>
        <div class="stat-value">${(status?.steps ?? 0).toLocaleString()}</div>
        <div class="stat-label">Steps</div>
      </div>
    </div>`;

    // Strain vs Recovery Balance
    const recovery = status?.recoveryScore ?? 50;
    let optLow, optHigh;
    if (recovery >= 67) { optLow = 40; optHigh = 85; }
    else if (recovery >= 34) { optLow = 20; optHigh = 55; }
    else { optLow = 0; optHigh = 30; }

    const isOptimal = strain >= optLow && strain <= optHigh;
    const balanceMsg = isOptimal ? 'Strain is well-matched to your recovery.' : strain > optHigh ? 'Strain is high relative to recovery. Consider easing off.' : 'You have more capacity today. Room for harder training.';

    html += `<div class="card">
      <div class="card-title mb-8">Strain vs Recovery Balance</div>
      <div class="flex items-center gap-8">
        <span style="color:${isOptimal ? 'var(--green)' : 'var(--orange)'};font-size:20px">${isOptimal ? '&#9989;' : '&#9888;'}</span>
        <span class="text-sm color-secondary">${balanceMsg}</span>
      </div>
      <div class="text-xs color-tertiary mt-8">Optimal strain range for today: ${optLow}-${optHigh}</div>
    </div>`;

    return html;
  },

  energyTab(status) {
    const energy = status?.energyLevel ?? 100;
    const baseline = status?.energyBaseline ?? 100;
    const color = energyColor(energy);
    const cat = energyCategory(energy);

    let html = '';

    // Battery
    html += `<div style="padding:16px 0">
      <div class="battery" style="border-color:${color}50">
        <div class="battery-fill" style="height:${Math.max(energy, 2)}%;background:linear-gradient(to top, ${color}, ${color}aa)"></div>
        <div class="battery-label">
          <div style="font-size:36px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5)">${Math.round(energy)}%</div>
          <div style="font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5)">${cat}</div>
        </div>
      </div>
      <div class="text-center text-sm color-secondary mt-8">Started at ${Math.round(baseline)}% based on recovery</div>
    </div>`;

    // Energy Drains
    if (status?.energyDrains?.length > 0) {
      html += '<div class="card"><div class="card-title mb-8">Energy Drains</div>';
      for (const d of status.energyDrains) {
        html += `<div class="flex items-center justify-between" style="padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,0.05)">
          <div>
            <div class="text-sm">${d.source}</div>
            <div class="text-xs color-secondary">${d.durationMinutes} min</div>
          </div>
          <div class="flex items-center gap-8">
            <span class="text-sm font-bold color-red">-${Math.round(d.amount)}%</span>
            <span class="text-xs color-secondary">${formatTime(d.time)}</span>
          </div>
        </div>`;
      }
      html += '</div>';
    }

    // Energy Tip
    let tip, tipIcon;
    if (energy >= 70) { tip = "Energy is high. Great time for a hard workout or test piece."; tipIcon = "&#9889;"; }
    else if (energy >= 40) { tip = "Moderate energy. Steady state or moderate gym session would be appropriate."; tipIcon = "&#9196;"; }
    else if (energy >= 20) { tip = "Energy is low. Light activity only — easy row, walk, or mobility."; tipIcon = "&#9196;"; }
    else { tip = "Energy depleted. Rest is the priority."; tipIcon = "&#128267;"; }

    html += `<div class="card" style="background:${color}08">
      <div class="flex items-center gap-8">
        <span>${tipIcon}</span>
        <span class="text-sm color-secondary">${tip}</span>
      </div>
    </div>`;

    return html;
  },

    const profile = await Store.getProfile();

    let html = '<div class="fade-in">';

    html += `<div class="segmented">

    if (subTab === 'today') {
      const rec = AICoach.generateRecommendation(profile, scores, status);
      if (rec) {
        const catColors = { workout: 'var(--blue)', recovery: 'var(--green)', technique: 'var(--purple)', milestone: 'var(--yellow)', warning: 'var(--red)' };
        const c = catColors[rec.category] || 'var(--blue)';

      html += '<div class="card"><div class="card-title mb-16">Weekly Training Plan</div>';
      for (let i = 0; i < plan.length; i++) {
        const p = plan[i];
        const isToday = i === todayIdx;
        const intensityColors = { Easy: 'var(--green)', Moderate: 'var(--blue)', Hard: 'var(--red)', Recovery: 'var(--text-tertiary)', Max: 'var(--orange)' };
        const c = intensityColors[p.intensity] || 'var(--blue)';

        html += `<div class="flex items-center justify-between" style="padding:12px 0;border-bottom:0.5px solid rgba(255,255,255,0.05);${isToday ? 'background:var(--blue)08;margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:8px' : ''}">

        html += `<div class="flex items-center gap-12" style="padding:12px 0;border-bottom:0.5px solid rgba(255,255,255,0.05)">

        <span style="font-size:24px">&#127942;</span>

      html += '</div>';

      html += `<div class="card" style="background:var(--blue)08">

          <span class="text-sm color-secondary">The AI coach learns from your data over time. Log more scores and workouts for better personalized recommendations.</span>

    return html;

  // =========================================
  // CALORIES
  // =========================================
  async calories() {
    const profile = await Store.getProfile();
    const todayEntries = await Store.getTodayCalories();

    const totalCal = todayEntries.reduce((a, e) => a + e.calories, 0);
    const totalProtein = todayEntries.reduce((a, e) => a + (e.protein || 0), 0);
    const totalCarbs = todayEntries.reduce((a, e) => a + (e.carbs || 0), 0);
    const totalFat = todayEntries.reduce((a, e) => a + (e.fat || 0), 0);

    const target = profile?.calorieTarget || 2500;
    const protTarget = profile?.proteinTarget || 150;
    const carbTarget = profile?.carbTarget || 300;
    const fatTarget = profile?.fatTarget || 80;

    let html = '<div class="fade-in">';

// ===== Main Application Controller =====

const App = {
  currentTab: 'dashboard',
  currentSubView: null,
  viewStack: [],
  activeGymSession: null,
  waterCount: 0,
  cameraStream: null,

  async init() {
    await Store.init();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      
    }

    // Tab bar events
    document.querySelectorAll('#tab-bar .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (tab === 'capture') {
          this.navigate('capture');
        } else {
          this.switchTab(tab);
        }
      });
    });

    // Check if profile exists
    const profile = await Store.getProfile();
    if (!profile) {
      this.navigate('profile');
    } else {
      this.switchTab('dashboard');
    }

    // Bluetooth HR live update
    BluetoothHR.onUpdate = (hr) => {
      if (this.currentTab === 'hr' || this.currentSubView === 'hr') {
        this.render();
      }
    };

    BluetoothHR.onDisconnect = () => {
      if (this.currentTab === 'hr' || this.currentSubView === 'hr') {
        this.render();
      }
    };
  },

  switchTab(tab) {
    this.currentTab = tab;
    this.currentSubView = null;
    this.viewStack = [];

    // Update tab bar
    document.querySelectorAll('#tab-bar .tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    // Update nav
    const titles = { dashboard: 'ErgAI', body: 'Body Status', capture: 'Capture', coach: 'AI Coach', more: 'More' };
    document.getElementById('nav-title').textContent = titles[tab] || 'ErgAI';
    this.hideBackButton();

    this.render();
  },

  navigate(view) {
    this.currentSubView = view;
    this.viewStack.push(view);

    const titles = {
      hr: 'Heart Rate', gym: 'Gym Tracker', history: 'Erg History',
      calories: 'Nutrition', profile: 'Profile', simulate: 'Simulate Data',
      capture: 'Capture'
    };

    document.getElementById('nav-title').textContent = titles[view] || 'ErgAI';
    this.showBackButton();
    this.render();
  },

  goBack() {
    this.viewStack.pop();
    if (this.viewStack.length > 0) {
      this.currentSubView = this.viewStack[this.viewStack.length - 1];
      this.render();
    } else {
      this.currentSubView = null;
      this.switchTab(this.currentTab);
    }
  },

  showBackButton() {
    const nav = document.getElementById('nav-bar');
    let backBtn = nav.querySelector('.nav-back');
    if (!backBtn) {
      backBtn = document.createElement('button');
      backBtn.className = 'nav-back';
      backBtn.innerHTML = '&#8249; Back';
      backBtn.onclick = () => this.goBack();
      nav.appendChild(backBtn);
    }
    backBtn.style.display = 'flex';
  },

  hideBackButton() {
    const backBtn = document.querySelector('.nav-back');
    if (backBtn) backBtn.style.display = 'none';
  },

  async render() {
    const content = document.getElementById('content');
    let html = '';

    try {
      if (this.currentSubView) {
        switch (this.currentSubView) {
          case 'hr': html = Views.hrMonitor(); break;
          case 'gym': html = await Views.gym(); break;
          case 'history': html = await Views.history(); break;
          case 'calories': html = await Views.calories(); break;
          case 'profile': html = await Views.profile(); break;
          case 'simulate': html = Views.simulate(); break;
          case 'capture': html = Views.capture(); break;
          default: html = await Views.dashboard();
        }
      } else {
        switch (this.currentTab) {
          case 'dashboard': html = await Views.dashboard(); break;
          case 'body': html = await Views.body(); break;
          case 'coach': html = await Views.coach(); break;
          case 'more': html = Views.more(); break;
          default: html = await Views.dashboard();
        }
      }
    } catch (e) {
      console.error('Render error:', e);
      html = `<div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error</div><div class="empty-subtitle">${e.message}</div></div>`;
    }

    content.innerHTML = html;
    content.scrollTop = 0;
  },

  // Body sub-tab
  async renderBody(subTab) {
    const content = document.getElementById('content');
    content.innerHTML = await Views.body(subTab);
  },

  // Coach sub-tab
  async renderCoach(subTab) {
    const content = document.getElementById('content');
    content.innerHTML = await Views.coach(subTab);
  },

  // ===== Score Management =====

  parseSplitToSeconds(splitStr) {
    if (!splitStr) return null;
    const parts = splitStr.split(':');
    if (parts.length !== 2) return null;
    return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
  },

  async saveScore() {
    const type = document.getElementById('score-type').value;
    const timeStr = document.getElementById('score-time').value;
    const distance = parseInt(document.getElementById('score-distance').value) || null;
    const splitStr = document.getElementById('score-split').value;
    const sr = parseInt(document.getElementById('score-sr').value) || null;
    const hr = parseInt(document.getElementById('score-hr').value) || null;
    const cal = parseInt(document.getElementById('score-cal').value) || null;

    const splitSeconds = this.parseSplitToSeconds(splitStr);
    if (!splitSeconds && !timeStr && !distance) {
      alert('Please enter at least a split, time, or distance.');
      return;
    }

    const score = {
      workoutType: type,
      timeStr: timeStr || null,
      distance: distance,
      splitSeconds: splitSeconds,
      strokeRate: sr,
      avgHR: hr,
      calories: cal,
      capturedFromPhoto: false,
      date: new Date().toISOString()
    };

    await Store.addScore(score);

    // Update profile
    const profile = await Store.getProfile();
    if (profile) {
      profile.totalWorkouts = (profile.totalWorkouts || 0) + 1;
      if (distance) profile.totalLifetimeMeters = (profile.totalLifetimeMeters || 0) + distance;
      profile.currentWeekSessions = (profile.currentWeekSessions || 0) + 1;
      if (distance) profile.currentWeekMeters = (profile.currentWeekMeters || 0) + distance;

      // Update PR
      if (type === '2k' && splitSeconds && (!profile.pr2k || splitSeconds < profile.pr2k)) {
        profile.pr2k = splitSeconds;
      }
      if (type === '5k' && splitSeconds && (!profile.pr5k || splitSeconds < profile.pr5k)) {
        profile.pr5k = splitSeconds;
      }

      await Store.saveProfile(profile);
    }

    alert('Score saved!');
    this.switchTab('dashboard');
  },

  // ===== Camera =====

  async startCamera() {
    try {
      const video = document.getElementById('camera-video');
      this.cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = this.cameraStream;
      video.style.display = 'block';

      const btn = document.getElementById('btn-camera');
      btn.textContent = '📷 Capture';
      btn.onclick = () => this.capturePhoto();
    } catch (e) {
      alert('Camera access denied or not available. Use the upload button or manual entry instead.');
    }
  },

  capturePhoto() {
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('camera-canvas');
    const img = document.getElementById('captured-img');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    const dataUrl = canvas.toDataURL('image/jpeg');
    img.src = dataUrl;
    img.style.display = 'block';
    video.style.display = 'none';

    // Stop camera
    if (this.cameraStream) {
      this.cameraStream.getTracks().forEach(t => t.stop());
      this.cameraStream = null;
    }

    // Show result area with message
    document.getElementById('capture-result').style.display = 'block';
    document.getElementById('ocr-result').innerHTML = `
      <div class="text-sm color-secondary">Photo captured. In-browser OCR is limited — please verify and enter values manually below, or use a native app for automatic OCR.</div>
    `;
  },

  uploadPhoto() {
    const input = document.getElementById('photo-upload');
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = document.getElementById('captured-img');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('capture-result').style.display = 'block';
        document.getElementById('ocr-result').innerHTML = `
          <div class="text-sm color-secondary">Photo uploaded. Enter the values you see on the erg screen into the fields below.</div>
        `;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  },

  async saveProfile() {
    const profile = (await Store.getProfile()) || createDefaultProfile();

    profile.name = document.getElementById('prof-name').value;
    profile.age = parseInt(document.getElementById('prof-age').value) || 20;
    profile.weight = parseInt(document.getElementById('prof-weight').value) || 80;
    profile.height = parseInt(document.getElementById('prof-height').value) || 180;
    profile.gender = document.getElementById('prof-gender').value;
    profile.maxHR = parseInt(document.getElementById('prof-maxhr').value) || 195;
    profile.restingHR = parseInt(document.getElementById('prof-resthr').value) || 60;
    profile.calorieTarget = parseInt(document.getElementById('prof-cal').value) || 2500;
    profile.proteinTarget = parseInt(document.getElementById('prof-protein').value) || 150;

  // ===== Gym =====

  startGymSession() {
    const name = prompt('Session name (e.g., Push Day, Pull Day):', 'Push Day');
    if (!name) return;

    this.activeGymSession = {
      sessionName: name,
      sessionType: 'custom',
      exercises: [],
      totalVolume: 0,
      totalSets: 0,
      durationMinutes: 0,
      strainScore: 0,
      startTime: new Date().toISOString(),
      date: new Date().toISOString()
    };

    this.render();
  },

  addExercise() {
    if (!this.activeGymSession) return;

    // Show exercise picker
    const names = ExerciseLibrary.map(e => e.name);
    const name = prompt('Exercise name:\n\nSuggestions: ' + names.slice(0, 10).join(', ') + '...');
    if (!name) return;

    const lib = ExerciseLibrary.find(e => e.name.toLowerCase() === name.toLowerCase());
    this.activeGymSession.exercises.push({
      name: name,
      muscleGroup: lib?.muscle || 'other',
      category: lib?.category || 'barbell',
      sets: []
    });

    this.render();
  },

  addSet(exerciseIdx) {
    if (!this.activeGymSession) return;
    const ex = this.activeGymSession.exercises[exerciseIdx];
    if (!ex) return;

    const lastSet = ex.sets[ex.sets.length - 1];
    const weight = prompt('Weight (kg):', lastSet?.weightKg || '60');
    if (!weight) return;
    const reps = prompt('Reps:', lastSet?.reps || '10');
    if (!reps) return;
    const rpe = prompt('RPE (1-10, optional):', '');

    ex.sets.push({
      weightKg: parseFloat(weight),
      reps: parseInt(reps),
      rpe: rpe ? parseFloat(rpe) : null,
      isWarmup: false
    });

    this.render();
  },

  async finishGymSession() {
    if (!this.activeGymSession) return;

    const session = this.activeGymSession;
    session.endTime = new Date().toISOString();
    session.durationMinutes = Math.round((new Date(session.endTime) - new Date(session.startTime)) / 60000);

    // Calculate totals
    let totalVol = 0, totalSets = 0;
    for (const ex of session.exercises) {
      for (const s of ex.sets) {
        if (!s.isWarmup) {
          totalVol += s.weightKg * s.reps;
          totalSets++;
        }
      }
    }
    session.totalVolume = totalVol;
    session.totalSets = totalSets;

    // Calculate strain
    const profile = await Store.getProfile();
    const maxHR = profile?.maxHR || 195;
    session.strainScore = RecoveryEngine.calculateGymStrain(totalVol, totalSets, session.durationMinutes, null, maxHR);

    await Store.saveGymSession(session);
    this.activeGymSession = null;

    alert(`Session saved! Volume: ${totalVol >= 1000 ? (totalVol/1000).toFixed(1) + 'k' : Math.round(totalVol)} kg, Strain: ${session.strainScore.toFixed(1)}`);
    this.render();
  },

    await Store.addCalorieEntry({
      name: food.name,
      calories: food.cal,
      protein: food.protein,

      </div>`
    ).join('');

    profile.pr5k = 115; // 1:55.0
    profile.totalWorkouts = 47;
    profile.totalLifetimeMeters = 892000;
    profile.currentWeekSessions = 4;
    profile.currentWeekMeters = 38000;
    profile.streakDays = 12;
    profile.fitnessScore = 72;
    profile.fatigueScore = 35;
    profile.formScore = 37;
    await Store.saveProfile(profile);

    // Erg Scores
    const scores = [
      { workoutType: '2k', splitSeconds: 105, distance: 2000, strokeRate: 30, avgHR: 182, date: new Date(Date.now() - 86400000 * 2).toISOString() },
      { workoutType: '5k', splitSeconds: 115.5, distance: 5000, strokeRate: 24, avgHR: 168, date: new Date(Date.now() - 86400000 * 4).toISOString() },
      { workoutType: 'steady_state', splitSeconds: 125, distance: 10000, strokeRate: 20, avgHR: 148, date: new Date(Date.now() - 86400000 * 5).toISOString() },
      { workoutType: '2k', splitSeconds: 106.5, distance: 2000, strokeRate: 29, avgHR: 180, date: new Date(Date.now() - 86400000 * 10).toISOString() },
      { workoutType: 'interval', splitSeconds: 100, distance: 4000, strokeRate: 28, avgHR: 175, date: new Date(Date.now() - 86400000 * 7).toISOString() },
    ];
    for (const s of scores) await Store.addScore(s);

    // Daily Statuses (7 days)
    for (let i = 0; i < 7; i++) {
      const date = new Date(Date.now() - 86400000 * i);
      const recovery = 40 + Math.random() * 50;
      const sleepMin = 350 + Math.floor(Math.random() * 150);
      const sleepScore = RecoveryEngine.calculateSleepScore(sleepMin, Math.floor(sleepMin * 0.17), Math.floor(sleepMin * 0.22));
      const strain = 10 + Math.random() * 60;
      const baseline = RecoveryEngine.calculateBaselineEnergy(recovery, sleepScore);

      const status = {
        date: date.toISOString(),
        recoveryScore: Math.round(recovery * 10) / 10,
        sleepScore: Math.round(sleepScore * 10) / 10,
        strainScore: Math.round(strain * 10) / 10,
        energyBaseline: Math.round(baseline),
        energyLevel: Math.round(baseline - strain * 0.3),
        totalSleepMinutes: sleepMin,
        deepSleepMinutes: Math.floor(sleepMin * 0.17),
        remSleepMinutes: Math.floor(sleepMin * 0.22),
        lightSleepMinutes: Math.floor(sleepMin * 0.5),
        awakeMinutes: Math.floor(sleepMin * 0.05),
        hrv: 40 + Math.random() * 40,
        rhr: 50 + Math.random() * 15,
        bloodOxygen: 95 + Math.random() * 4,
        respiratoryRate: 13 + Math.random() * 4,
        wristTemp: -0.3 + Math.random() * 0.6,
        steps: 5000 + Math.floor(Math.random() * 8000),
        activeCalories: 200 + Math.floor(Math.random() * 500),
        activeMinutes: 20 + Math.floor(Math.random() * 60),
        energyDrains: i === 0 ? [
          { source: 'Morning Row (SS)', durationMinutes: 50, amount: 18, time: new Date(date.getTime() + 28800000).toISOString() },
          { source: 'Gym Session', durationMinutes: 60, amount: 22, time: new Date(date.getTime() + 54000000).toISOString() }
        ] : []
      };

      await Store.saveDailyStatus(status);
    }

    // Gym session
    const gymSession = {
      sessionName: 'Push Day',
      sessionType: 'push',
      exercises: [
        { name: 'Bench Press', muscleGroup: 'chest', category: 'barbell', sets: [
          { weightKg: 80, reps: 8, rpe: 7, isWarmup: false },
          { weightKg: 85, reps: 6, rpe: 8, isWarmup: false },
          { weightKg: 85, reps: 5, rpe: 9, isWarmup: false }
        ]},
        { name: 'Overhead Press', muscleGroup: 'shoulders', category: 'barbell', sets: [
          { weightKg: 50, reps: 8, rpe: 7, isWarmup: false },
          { weightKg: 50, reps: 7, rpe: 8, isWarmup: false }
        ]},
        { name: 'Lateral Raise', muscleGroup: 'shoulders', category: 'dumbbell', sets: [
          { weightKg: 12, reps: 15, rpe: 8, isWarmup: false },
          { weightKg: 12, reps: 12, rpe: 9, isWarmup: false }
        ]}
      ],
      totalVolume: 80*8 + 85*6 + 85*5 + 50*8 + 50*7 + 12*15 + 12*12,
      totalSets: 7,
      durationMinutes: 55,
      strainScore: 42,
      date: new Date(Date.now() - 86400000).toISOString()
    };
    await Store.saveGymSession(gymSession);

    // Calorie entries
    const foods = [
      { name: 'Oatmeal (1 cup)', calories: 300, protein: 10, carbs: 54, fat: 5 },
      { name: 'Whey Protein Shake', calories: 150, protein: 30, carbs: 3, fat: 2 },
      { name: 'Chicken Breast (6oz)', calories: 280, protein: 53, carbs: 0, fat: 6 },
      { name: 'Brown Rice (1 cup)', calories: 215, protein: 5, carbs: 45, fat: 2 }
    ];
    for (const f of foods) {
      await Store.addCalorieEntry({ ...f, name: f.name, date: new Date().toISOString() });
    }

    alert('Sample data generated! Explore the app to see everything in action.');
    this.switchTab('dashboard');
  },

  async clearAllData() {
    if (!confirm('Delete ALL app data? This cannot be undone.')) return;

    await Store.clear('profile');
    await Store.clear('scores');
    await Store.clear('dailyStatus');
    await Store.clear('gymSessions');
    await Store.clear('calorieEntries');
    await Store.clear('hrSessions');
    await Store.clear('baselines');

    this.activeGymSession = null;
    this.waterCount = 0;

    alert('All data cleared.');
    this.switchTab('dashboard');
  }
};

// ===== Boot =====
document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
